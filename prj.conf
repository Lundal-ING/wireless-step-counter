# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="StepCounter"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Nordic UART Service
CONFIG_BT_NUS=y

# I2C
CONFIG_I2C=y

# Serial / Console (needed for printf and printk output)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Logging (optional but helpful during development)
CONFIG_LOG=y
CONFIG_BT_NUS_LOG_LEVEL_DBG=n

CONFIG_SENSOR=y
CONFIG_BMI160=y